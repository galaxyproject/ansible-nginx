---

- name: Configure nginx.org repository
  when: nginx_source == "nginx.org"
  block:

    - name: Add nginx.org repository
      ansible.builtin.yum_repository:
        name: "nginx-{{ nginx_org_channel }}"
        description: "nginx {{ nginx_org_channel }} repo"
        file: nginx
        baseurl: >-
          https://nginx.org/packages/{{ (nginx_org_channel == 'mainline') | ternary('mainline/', '') }}centos/{{
          ansible_facts['distribution_major_version'] }}/$basearch/
        gpgcheck: true
        gpgkey: https://nginx.org/keys/nginx_signing.key
        module_hotfixes: true

    - name: Remove unused nginx.org repository
      ansible.builtin.yum_repository:
        name: "nginx-{{ (nginx_org_channel == 'mainline') | ternary('stable', 'mainline') }}"
        file: nginx
        state: absent

- name: Install nginx
  ansible.builtin.dnf:
    name: "{{ ['nginx'] + nginx_extra_packages }}"
  notify:
    - Restart nginx

# nginx.org packages use /var/cache/nginx instead, which is world-traversable, and nginx chowns its temp directories to
# the worker user at startup
- name: Set permissions on temporary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nginx_conf_user | default('nginx') }}"
    group: "{{ nginx_conf_group | default('nginx') }}"
    mode: "0700"
  loop:
    - /var/lib/nginx
    - /var/lib/nginx/tmp
  when: nginx_source == "os"
